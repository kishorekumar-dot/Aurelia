services:
  - type: web
    name: aurelia-backend
    runtime: python
    region: singapore  # closest free region to India
    plan: free

    # Build from the backend subfolder
    rootDir: backend

    buildCommand: pip install -r ../requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      # ── Application ─────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHONPATH
        value: .

      # ── JWT: auto-generated by Render ────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      # ── CORS: fill in after you know your Vercel URL ─────────────────
      # Example: https://aurelia-abc.vercel.app
      - key: CORS_EXTRA_ORIGINS
        value: ""

      # ── OpenRouter LLM ───────────────────────────────────────────────
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_PRIMARY_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: OPENROUTER_FALLBACK_MODEL_1
        value: mistralai/mistral-7b-instruct:free
      - key: OPENROUTER_FALLBACK_MODEL_2
        value: google/gemma-3-12b-it:free
      - key: OPENROUTER_MAX_RETRIES
        value: "2"
      # Set OPENROUTER_API_KEY_1 manually in the Render dashboard

      # ── Tavily Web Search ────────────────────────────────────────────
      - key: TAVILY_BASE_URL
        value: https://api.tavily.com
      - key: TAVILY_MAX_RETRIES
        value: "2"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      # Set TAVILY_API_KEY_1 manually in the Render dashboard
